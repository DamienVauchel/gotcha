# gotcha manifest — the only file that knows about this repo.
# Everything else in the plugin is generic. Generated by /gotcha-init.

subject: <module or bounded context this base covers, e.g. src/payments>

# Language of the source base in gotchas/ — read by the agent, grepped against
# code and logs. English unless the team insists.
language: en

# Human-friendly docs, generated from gotchas/ by /gotcha-publish
# (references/publishing.md). Asked once by /gotcha-init.
#   publish_targets:  comma-separated channels, any mix of: docs | pdf | artifact |
#                     claude-docs | drive | notion | confluence | github-wiki |
#                     other:<tool> | none
#   publish_language: language of the human docs (en, fr, de, es, …)
#   publish_dir:      output folder when the target is docs
#   publish_location_<channel>: where a remote channel publishes (Confluence space
#                     + parent page URL, Notion parent page URL, Drive folder, …)
#   publish_when:     on-change (rebuild the docs/ channel at the end of any turn
#                     that changed gotchas/) | manual (/gotcha-publish, e.g. after
#                     merge — always the case for remote channels)
publish_targets: docs
publish_language: en
publish_dir: docs
publish_when: on-change

# Write-back behaviour (references/capture-contract.md § Modes):
#   auto    — write findings directly; the PR is the review   (default)
#   propose — list findings, write after confirmation
#   off     — no automatic nudge; only explicit /gotcha-capture
autocapture: auto

# The Stop hook asks for a write-back when a turn edited at least this many code
# files, or read at least this many distinct ones, without touching gotchas/.
nudge_min_edits: 1
nudge_min_reads: 6

# The axes a bug gets classified along. /gotcha-init seeds one troubleshooting
# theme per scope; /gotcha-tidy splits them as real incidents accumulate.
scopes:
  - <scope>

# Areas documented under modules/.
areas:
  - <area>: <path>

# The recurring per-instance thing worth its own page. Delete the key if none.
entities:
  kind: <partner | provider | tenant | plugin>
  source: <the enum, registry or config map that lists them, with its path>
  members:
    - <name>

# Where a finding goes. Every write path follows this table literally.
routing:
  module: gotchas/modules/{area}.md
  overview: gotchas/overview.md
  convention: gotchas/conventions.md
  term: gotchas/glossary.md
  decision: gotchas/decisions.md
  entity_specific: gotchas/entities/{entity}.md
  troubleshooting: gotchas/troubleshooting/{theme}.md
  standard: gotchas/standards/{name}.md
  index: gotchas/INDEX.md
  troubleshooting_index: gotchas/troubleshooting/INDEX.md
  entity_template: gotchas/_template.md

# Only commands you have verified exist. A wrong repro command costs more than a
# missing one.
evidence:
  logs: <log-platform query pattern, e.g. "@service:{service} status:error">
  repro: <command to reproduce>
  tests: <test command scoped to the subject>
  state: <how to inspect persistent state — psql, redis-cli, queue admin CLI>

# Existing docs the skills should read for a given scope. Optional.
scope_docs:
  <scope>: <path/to/doc.md>
