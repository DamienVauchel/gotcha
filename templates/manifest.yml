# gotcha manifest — the only file that knows about this repo.
# Everything else in the plugin is generic. Generated by /gotcha-init.

subject: <module or bounded context this base covers, e.g. src/Connect>

# The axes a bug gets classified along in Phase 1 of /gotcha-investigate.
# Derived from the code: entry-point families, protocols, integration kinds.
scopes:
  - <scope>

# The recurring per-instance thing worth its own page: partners, providers,
# tenants, plugins. Delete this key entirely if the repo has no such axis.
entities:
  kind: <partner | provider | tenant | plugin>
  source: <the enum, registry or config map that lists them, with its path>
  members:
    - <name>

# Where a finding goes. /gotcha-investigate Phase 6 follows this table literally.
routing:
  entity_specific: gotchas/entities/{entity}.md
  cross_cutting: gotchas/failure-modes.md
  standard: gotchas/standards/{name}.md
  index: gotchas/INDEX.md
  entity_template: gotchas/_template.md

# Only list commands you have verified exist. A wrong repro command costs more
# than a missing one.
evidence:
  logs: <log-platform query pattern, e.g. "@service:{service} status:error">
  repro: <command to reproduce, e.g. "docker exec -it <container> bin/console {cmd}">
  tests: <test command scoped to the subject>
  state: <how to inspect persistent state — psql, redis-cli, queue admin CLI>

# Extra docs /gotcha-investigate should read for a given scope, beyond the
# failure-modes page. Optional.
scope_docs:
  <scope>: <path/to/doc.md>
