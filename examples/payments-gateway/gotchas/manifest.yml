# gotcha manifest — the only file that knows about this repo.
# Everything else in the plugin is generic. Generated by /gotcha-init.

subject: src/payments

language: en
autocapture: auto
nudge_min_edits: 1
nudge_min_reads: 6

scopes:
  - charge          # outbound card charge: intent, confirm, capture
  - refund          # full and partial refunds, disputes
  - webhook         # inbound provider events
  - reconciliation  # nightly settlement match against provider reports
  - sca             # 3-D Secure / PSD2 challenge flow

areas:
  - charge: src/payments/charge

entities:
  kind: provider
  source: src/payments/providers/registry.ts (PROVIDERS const)
  members:
    - stripe
    - adyen

routing:
  module: gotchas/modules/{area}.md
  overview: gotchas/overview.md
  convention: gotchas/conventions.md
  term: gotchas/glossary.md
  decision: gotchas/decisions.md
  entity_specific: gotchas/entities/{entity}.md
  troubleshooting: gotchas/troubleshooting/{theme}.md
  standard: gotchas/standards/{name}.md
  index: gotchas/INDEX.md
  troubleshooting_index: gotchas/troubleshooting/INDEX.md
  entity_template: gotchas/_template.md

evidence:
  logs: 'service:payments env:prod @provider:{provider} status:error'
  repro: 'npm run cli -- payments:charge --provider={provider} --amount=1000 --currency=EUR --dry-run'
  tests: 'npm test -- src/payments'
  state: 'psql $DATABASE_URL -c "select * from payment_attempts where id = ..."'

scope_docs:
  sca: gotchas/standards/psd2-sca.md
  reconciliation: docs/runbooks/nightly-settlement.md
